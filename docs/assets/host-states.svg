<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Host states in the 3D console</title><desc id="d">Four host states, each with its own shape and colour: normal is a slate sphere, compromised is a red octahedron, contained is a teal cube with a ring, and a predicted next target is wrapped in a dashed violet ring with a confidence percentage.</desc>
<defs><radialGradient id="gSlate" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#cbd5e1"/><stop offset=".55" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></radialGradient>
<radialGradient id="gRed" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#fca5a5"/><stop offset=".55" stop-color="#ef4444"/><stop offset="1" stop-color="#7f1d1d"/></radialGradient>
<radialGradient id="gTeal" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f4f4a"/></radialGradient>
<radialGradient id="gViolet" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#e9d5ff"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#581c87"/></radialGradient>
<filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowTeal" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter></defs>
<style>
.s{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .m{font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
.pulse2{animation-delay:1.1s}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.3);opacity:.85}65%{opacity:0}100%{transform:scale(1);opacity:0}}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pulse,.breathe{animation:none} .pulse{opacity:0}}

</style>
<rect width="1000" height="350" rx="22" fill="#0b0f14"/><rect x=".5" y=".5" width="999" height="349" rx="21.5" fill="none" stroke="#263042"/>
<rect x="19" y="22" width="230" height="276" rx="16" fill="#121821" stroke="#263042"/>
<polygon points="71.6,126 134,162 134,171 71.6,135" fill="#0c1118" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="134,162 196.4,126 196.4,135 134,171" fill="#0e141c" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="134,90 196.4,126 134,162 71.6,126" fill="#1a2230" stroke="#263042" stroke-width="1.2" stroke-linejoin="round"/>
<ellipse cx="134" cy="134" rx="15.8" ry="7.9" fill="#000" opacity=".4" filter="url(#blur3)"/><circle cx="134" cy="119" r="15" fill="url(#gSlate)"/>
<text class="s" x="134" y="200" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle" >Normal</text>
<text class="s" x="134" y="226" font-size="14.5" font-weight="600" fill="#94a3b8" text-anchor="middle" >Nothing to report.</text>
<text class="s" x="134" y="248" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Quiet on purpose, so the</text>
<text class="s" x="134" y="267" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >other three stand out.</text>

<rect x="263" y="22" width="230" height="276" rx="16" fill="#121821" stroke="#263042"/>
<polygon points="315.6,126 378,162 378,171 315.6,135" fill="#0c1118" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="378,162 440.4,126 440.4,135 378,171" fill="#0e141c" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="378,90 440.4,126 378,162 315.6,126" fill="#1a2230" stroke="#263042" stroke-width="1.2" stroke-linejoin="round"/>
<ellipse cx="378" cy="134" rx="20.9" ry="10.5" fill="#000" opacity=".4" filter="url(#blur3)"/><g filter="url(#glowRed)"><polygon points="378,85.5 359,108.3 378,117.8" fill="#fca5a5" stroke="#7f1d1d" stroke-width=".8" stroke-linejoin="round"/><polygon points="378,85.5 397,108.3 378,117.8" fill="#ef4444" stroke="#7f1d1d" stroke-width=".8" stroke-linejoin="round"/><polygon points="378,131.2 359,108.3 378,117.8" fill="#b91c1c" stroke="#7f1d1d" stroke-width=".8" stroke-linejoin="round"/><polygon points="378,131.2 397,108.3 378,117.8" fill="#dc2626" stroke="#7f1d1d" stroke-width=".8" stroke-linejoin="round"/></g>
<text class="s" x="378" y="200" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle" >Compromised</text>
<text class="s" x="378" y="226" font-size="14.5" font-weight="600" fill="#f87171" text-anchor="middle" >What happened.</text>
<text class="s" x="378" y="248" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Confirmed by the detector.</text>
<text class="s" x="378" y="267" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Pulses once when it appears.</text>

<rect x="507" y="22" width="230" height="276" rx="16" fill="#121821" stroke="#263042"/>
<polygon points="559.6,126 622,162 622,171 559.6,135" fill="#0c1118" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="622,162 684.4,126 684.4,135 622,171" fill="#0e141c" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="622,90 684.4,126 622,162 559.6,126" fill="#1a2230" stroke="#263042" stroke-width="1.2" stroke-linejoin="round"/>
<ellipse cx="622" cy="134" rx="33.6" ry="16.9" fill="none" stroke="#14b8a6" stroke-width="1.6" opacity=".9"/><g filter="url(#glowTeal)"><polygon points="600.3,109 622,121.5 622,146.5 600.3,134" fill="#0f766e" stroke="#0b4f4a" stroke-width=".8" stroke-linejoin="round"/><polygon points="622,121.5 643.7,109 643.7,134 622,146.5" fill="#14b8a6" stroke="#0b4f4a" stroke-width=".8" stroke-linejoin="round"/><polygon points="622,96.5 643.7,109 622,121.5 600.3,109" fill="#5eead4" stroke="#0b4f4a" stroke-width=".8" stroke-linejoin="round"/></g>
<text class="s" x="622" y="200" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle" >Contained</text>
<text class="s" x="622" y="226" font-size="14.5" font-weight="600" fill="#5eead4" text-anchor="middle" >What you did.</text>
<text class="s" x="622" y="248" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Isolated after a confirmed</text>
<text class="s" x="622" y="267" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Contain (simulated).</text>

<rect x="751" y="22" width="230" height="276" rx="16" fill="#121821" stroke="#263042"/>
<polygon points="803.6,126 866,162 866,171 803.6,135" fill="#0c1118" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="866,162 928.4,126 928.4,135 866,171" fill="#0e141c" stroke="#263042" stroke-width="1" stroke-linejoin="round"/><polygon points="866,90 928.4,126 866,162 803.6,126" fill="#1a2230" stroke="#263042" stroke-width="1.2" stroke-linejoin="round"/>
<defs><linearGradient id="cs" gradientUnits="userSpaceOnUse" x1="814" y1="104" x2="860" y2="131"><stop offset="0" stop-color="#a855f7" stop-opacity="0.1"/><stop offset="1" stop-color="#a855f7" stop-opacity="0.6"/></linearGradient></defs><g><polygon points="814,104 852.4,143.9 867.6,118.1" fill="url(#cs)"/><ellipse cx="860" cy="131" rx="4.8" ry="15" transform="rotate(30.4 860 131)" fill="#a855f7" fill-opacity="0.5" stroke="#c084fc" stroke-opacity="0.8" stroke-width="1"/></g>
<ellipse cx="866" cy="134" rx="33" ry="16.5" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="6 5" stroke-linecap="round"/>
<ellipse cx="866" cy="134" rx="15.8" ry="7.9" fill="#000" opacity=".4" filter="url(#blur3)"/><circle cx="866" cy="119" r="15" fill="url(#gSlate)"/>
<text class="m" x="868" y="76" font-size="20" font-weight="700" fill="#c084fc" text-anchor="middle" >74 %</text>
<text class="s" x="866" y="200" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle" >Predicted target</text>
<text class="s" x="866" y="226" font-size="14.5" font-weight="600" fill="#c084fc" text-anchor="middle" >What Precog predicts.</text>
<text class="s" x="866" y="248" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >Always shown with its</text>
<text class="s" x="866" y="267" font-size="14" font-weight="400" fill="#9aa7b8" text-anchor="middle" >confidence, never as certainty.</text>

<text class="s" x="500" y="334" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" >No green, on purpose: nothing in a simulation is ever safe to claim.</text>
</svg>